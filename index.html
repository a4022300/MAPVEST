  <!-- JS 邏輯 -->
  <script>
    // 全域變數
    let map;
    let baseLayers = {};
    let currentGeoJsonLayer = null;
    let currentFeatures = [];
    let layerFeatureMap = {}; // id -> L.Layer
    let userLocation = null;
    let userMarker = null;
    let accuracyCircle = null;
    
    // 現調資料存儲 (Key: feature_id)
    let surveyDataMap = {};
    let activeFeatureId = null;
    let tempCapturedPhoto = null; // 暫存待確認照片

    // 初始化地圖
    function initMap() {
      // 預設中心：臺灣
      map = L.map('map', { zoomControl: false }).setView([23.9738, 120.9820], 8);

      // 建立底圖
      baseLayers.osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      });

      baseLayers.satellite = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        attribution: 'Google Satellite'
      });

      baseLayers.hybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        attribution: 'Google Hybrid'
      });

      // 預設載入 Google 衛星底圖
      baseLayers.satellite.addTo(map);

      // 地圖點擊事件：關閉面板
      map.on('click', () => {
        closeFeatureDrawer();
      });
    }

    // 切換底圖
    function switchBaseMap(type) {
      Object.values(baseLayers).forEach(layer => map.removeLayer(layer));
      if (baseLayers[type]) {
        baseLayers[type].addTo(map);
      }
    }

    // 上傳 Shapefile (.zip)
    async function handleShpUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const layerListEl = document.getElementById('layer-list');
      layerListEl.innerHTML = '<p class="text-xs text-blue-600 animate-pulse font-medium">解析 Shapefile 中...</p>';

      try {
        const buffer = await file.arrayBuffer();
        const geojson = await shp(buffer);

        // 清除先前圖層
        if (currentGeoJsonLayer) {
          map.removeLayer(currentGeoJsonLayer);
        }

        // 載入 GeoJSON 到 Leaflet
        const features = Array.isArray(geojson) ? geojson[0] : geojson;
        currentFeatures = features.features || [];
        layerFeatureMap = {};
        
        renderLayerOnMap(features);

        // 縮放到圖層範圍
        if (currentGeoJsonLayer && currentGeoJsonLayer.getBounds().isValid()) {
          map.fitBounds(currentGeoJsonLayer.getBounds());
        }

        // 更新 UI 圖層列表與變異點清單
        layerListEl.innerHTML = '';
        const item = document.createElement('div');
        item.className = 'p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs flex justify-between items-center';
        item.innerHTML = `
          <div class="truncate">
            <p class="font-bold text-slate-700 truncate">${file.name}</p>
            <p class="text-[10px] text-slate-400">${currentFeatures.length} 個物件/變異點</p>
          </div>
          <i class="fa-solid fa-check text-emerald-500"></i>
        `;
        layerListEl.appendChild(item);

        renderFeatureList();
        updateCounts();

      } catch (err) {
        console.error(err);
        alert('Shapefile 解析失敗，請確認 ZIP 檔內包含完整的 .shp, .dbf 與 .prj 檔案 (且座標系為 WGS84)。');
      }
    }

    // 渲染圖層至地圖
    function renderLayerOnMap(geojsonFeatures) {
      const strokeColor = document.getElementById('style-stroke-color').value;
      const fillColor = document.getElementById('style-fill-color').value;
      const strokeWeight = parseInt(document.getElementById('style-stroke-weight').value);
      const fillOpacity = parseFloat(document.getElementById('style-fill-opacity').value);

      currentGeoJsonLayer = L.geoJSON(geojsonFeatures, {
        onEachFeature: (feature, layer) => {
          const id = feature.id || ('feat_' + Math.random().toString(36).substr(2, 9));
          feature.id = id;
          layerFeatureMap[id] = layer;

          if (!surveyDataMap[id]) {
            surveyDataMap[id] = {
              id: id,
              properties: feature.properties || {},
              geometry: feature.geometry,
              notes: '',
              photos: [],
              surveyCoords: null
            };
          }

          layer.on('click', (e) => {
            L.DomEvent.stopPropagation(e);
            openFeatureDrawer(id, e.latlng);
          });
        },
        style: {
          color: strokeColor,
          weight: strokeWeight,
          opacity: 0.9,
          fillColor: fillColor,
          fillOpacity: fillOpacity
        },
        pointToLayer: (feature, latlng) => {
          return L.circleMarker(latlng, {
            radius: Math.max(6, strokeWeight + 2),
            fillColor: fillColor,
            color: strokeColor,
            weight: strokeWeight,
            fillOpacity: Math.min(1, fillOpacity + 0.3)
          });
        }
      }).addTo(map);
    }

    // 動態更新圖層樣式 (即時效果)
    function applyLayerStyle() {
      const strokeColor = document.getElementById('style-stroke-color').value;
      const fillColor = document.getElementById('style-fill-color').value;
      const strokeWeight = parseInt(document.getElementById('style-stroke-weight').value);
      const fillOpacity = parseFloat(document.getElementById('style-fill-opacity').value);

      document.getElementById('weight-val').innerText = `${strokeWeight}px`;
      document.getElementById('opacity-val').innerText = `${Math.round(fillOpacity * 100)}%`;

      if (!currentGeoJsonLayer) return;

      currentGeoJsonLayer.setStyle({
        color: strokeColor,
        weight: strokeWeight,
        fillColor: fillColor,
        fillOpacity: fillOpacity
      });

      // 點圖徵特殊處理
      currentGeoJsonLayer.eachLayer(layer => {
        if (layer instanceof L.CircleMarker) {
          layer.setStyle({
            radius: Math.max(6, strokeWeight + 2),
            fillColor: fillColor,
            color: strokeColor,
            weight: strokeWeight,
            fillOpacity: Math.min(1, fillOpacity + 0.3)
          });
        }
      });
    }

    // 渲染變異點清單
    function renderFeatureList() {
      const featureListEl = document.getElementById('feature-list');
      const badgeEl = document.getElementById('feature-count-badge');
      featureListEl.innerHTML = '';
      badgeEl.innerText = `${currentFeatures.length} 筆`;

      if (currentFeatures.length === 0) {
        featureListEl.innerHTML = '<p class="text-xs text-slate-400 italic p-2 text-center">尚無變異點資料</p>';
        return;
      }

      currentFeatures.forEach((feat, index) => {
        const id = feat.id;
        const props = feat.properties || {};
        const title = props['Name'] || props['名稱'] || props['ID'] || props['LAND_ID'] || `變異點 #${index + 1}`;
        const subTitle = props['TYPE'] || props['類型'] || feat.geometry.type;

        const itemBtn = document.createElement('button');
        itemBtn.className = 'w-full text-left p-2 rounded-lg bg-white border border-slate-200 hover:border-blue-500 hover:bg-blue-50/50 transition flex items-center justify-between group text-xs';
        itemBtn.onclick = () => focusOnFeature(id);
        
        itemBtn.innerHTML = `
          <div class="truncate pr-2">
            <p class="font-bold text-slate-800 truncate group-hover:text-blue-600">${title}</p>
            <p class="text-[10px] text-slate-400 truncate">${subTitle}</p>
          </div>
          <i class="fa-solid fa-crosshairs text-slate-300 group-hover:text-blue-500 transition"></i>
        `;
        featureListEl.appendChild(itemBtn);
      });
    }

    // 單一變異點聚焦 (Fly to / Focus)
    function focusOnFeature(id) {
      const layer = layerFeatureMap[id];
      const item = surveyDataMap[id];
      if (!item) return;

      let targetLatLng;

      if (layer && typeof layer.getBounds === 'function') {
        const bounds = layer.getBounds();
        targetLatLng = bounds.getCenter();
        map.flyToBounds(bounds, { maxZoom: 18, duration: 1 });
      } else if (layer && typeof layer.getLatLng === 'function') {
        targetLatLng = layer.getLatLng();
        map.flyTo(targetLatLng, 18, { duration: 1 });
      } else {
        // Fallback geometry center
        let coords = item.geometry.coordinates;
        if (item.geometry.type === 'Point') {
          targetLatLng = L.latLng(coords[1], coords[0]);
        } else {
          let firstPoint = Array.isArray(coords[0][0]) ? coords[0][0] : coords[0];
          targetLatLng = L.latLng(firstPoint[1], firstPoint[0]);
        }
        map.flyTo(targetLatLng, 18, { duration: 1 });
      }

      // 自動關閉側邊欄，打開變異點詳細抽屜
      toggleSidebar();
      setTimeout(() => {
        openFeatureDrawer(id, targetLatLng);
      }, 600);
    }

    // 隨機手動新增調查點 (若沒有 SHP)
    function createNewSurveyPoint() {
      const center = map.getCenter();
      const id = 'manual_' + Math.random().toString(36).substr(2, 9);
      const strokeColor = document.getElementById('style-stroke-color').value;

      surveyDataMap[id] = {
        id: id,
        properties: { 名稱: '自訂調查點 ' + (Object.keys(surveyDataMap).length + 1) },
        geometry: { type: 'Point', coordinates: [center.lng, center.lat] },
        notes: '',
        photos: [],
        surveyCoords: null
      };

      const marker = L.marker(center, {
        icon: L.divIcon({
          className: 'custom-div-icon',
          html: `<div style="background-color:${strokeColor};width:18px;height:18px;border-radius:50%;border:2px solid white;box-shadow:0 2px 5px rgba(0,0,0,0.3);"></div>`,
          iconSize: [18, 18],
          iconAnchor: [9, 9]
        })
      }).addTo(map);

      layerFeatureMap[id] = marker;
      marker.on('click', () => {
        openFeatureDrawer(id, center);
      });

      // 加入特徵列表
      currentFeatures.push({
        id: id,
        properties: surveyDataMap[id].properties,
        geometry: surveyDataMap[id].geometry
      });
      renderFeatureList();
      updateCounts();

      openFeatureDrawer(id, center);
    }

    // 開啟物件抽屜
    function openFeatureDrawer(id, latlng) {
      activeFeatureId = id;
      const data = surveyDataMap[id];
      if (!data) return;

      // 填入座標資訊
      document.getElementById('target-coords').innerText = `${latlng.lat.toFixed(6)}, ${latlng.lng.toFixed(6)}`;
      
      // 計算與當前 GPS 位置之距離
      if (userLocation) {
        const dist = userLocation.distanceTo(latlng);
        document.getElementById('dist-to-target').innerText = dist > 1000 ? `${(dist / 1000).toFixed(2)} km` : `${Math.round(dist)} m`;
      } else {
        document.getElementById('dist-to-target').innerText = '未定位';
      }

      // 渲染 SHP 屬性
      const propsContainer = document.getElementById('drawer-properties');
      propsContainer.innerHTML = '';
      if (data.properties && Object.keys(data.properties).length > 0) {
        for (const [key, val] of Object.entries(data.properties)) {
          const row = document.createElement('div');
          row.className = 'flex justify-between py-1 border-b border-slate-100 last:border-0 text-xs';
          row.innerHTML = `<span class="text-slate-400 font-medium">${key}</span><span class="text-slate-700 font-semibold truncate max-w-[180px]">${val ?? ''}</span>`;
          propsContainer.appendChild(row);
        }
      } else {
        propsContainer.innerHTML = '<p class="text-xs text-slate-400 italic">無屬性資料</p>';
      }

      // 帶入現場筆記
      document.getElementById('field-notes').value = data.notes || '';

      // 渲染相片列表
      renderPhotosList();

      // 開啟 Drawer
      const drawer = document.getElementById('feature-drawer');
      drawer.classList.remove('translate-y-full');
    }

    // 關閉抽屜
    function closeFeatureDrawer() {
      const drawer = document.getElementById('feature-drawer');
      drawer.classList.add('translate-y-full');
      activeFeatureId = null;
    }

    // 保存筆記
    function saveNotes() {
      if (!activeFeatureId || !surveyDataMap[activeFeatureId]) return;
      const val = document.getElementById('field-notes').value;
      surveyDataMap[activeFeatureId].notes = val;
    }

    // 導航至該位置
    function navigateToTarget() {
      if (!activeFeatureId || !surveyDataMap[activeFeatureId]) return;
      const data = surveyDataMap[activeFeatureId];
      let lat, lng;

      if (data.geometry && data.geometry.type === 'Point') {
        [lng, lat] = data.geometry.coordinates;
      } else {
        const layer = layerFeatureMap[activeFeatureId];
        if (layer && typeof layer.getBounds === 'function') {
          const center = layer.getBounds().getCenter();
          lat = center.lat;
          lng = center.lng;
        } else if (layer && typeof layer.getLatLng === 'function') {
          const pos = layer.getLatLng();
          lat = pos.lat;
          lng = pos.lng;
        }
      }

      if (lat && lng) {
        window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`, '_blank');
      } else {
        alert('無法取得該物件有效座標');
      }
    }

    // 喚起相機 / 選取相片
    function triggerCamera() {
      if (!activeFeatureId) {
        alert('請先在地圖上點選或選擇一個變異點！');
        return;
      }

      // 當前無實測座標時嘗試記錄當前 GPS
      if (userLocation && surveyDataMap[activeFeatureId]) {
        surveyDataMap[activeFeatureId].surveyCoords = {
          lat: userLocation.lat,
          lng: userLocation.lng
        };
      }

      document.getElementById('camera-input').click();
    }

    // 處理相片拍攝 / 選取 (連拍工作流)
    function handlePhotoCapture(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        tempCapturedPhoto = {
          name: `PHOTO_${activeFeatureId}_${Date.now()}.jpg`,
          dataUrl: e.target.result,
          file: file
        };

        // 顯示照片預覽 modal
        document.getElementById('photo-confirm-img').src = tempCapturedPhoto.dataUrl;
        document.getElementById('photo-confirm-modal').classList.remove('hidden');
      };
      reader.readAsDataURL(file);

      // 清空 input 讓重複拍攝同檔名能觸發 onchange
      event.target.value = '';
    }

    // 確認保存照片 (Y/N)
    function confirmSavePhoto(isSave) {
      document.getElementById('photo-confirm-modal').classList.add('hidden');

      if (isSave && tempCapturedPhoto && activeFeatureId && surveyDataMap[activeFeatureId]) {
        surveyDataMap[activeFeatureId].photos.push(tempCapturedPhoto);
        renderPhotosList();
        updateCounts();

        // 保存後自動繼續觸發連拍
        setTimeout(() => {
          triggerCamera();
        }, 300);
      }
      tempCapturedPhoto = null;
    }

    // 渲染相片預覽圖
    function renderPhotosList() {
      const photoGrid = document.getElementById('photo-grid');
      photoGrid.innerHTML = '';
      if (!activeFeatureId || !surveyDataMap[activeFeatureId]) return;

      const photos = surveyDataMap[activeFeatureId].photos || [];
      photos.forEach((photo, idx) => {
        const div = document.createElement('div');
        div.className = 'relative group aspect-square rounded-lg overflow-hidden border border-slate-200 bg-slate-100';
        div.innerHTML = `
          <img src="${photo.dataUrl}" class="w-full h-full object-cover">
          <button onclick="removePhoto(${idx})" class="absolute top-1 right-1 bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px] shadow opacity-80 hover:opacity-100">
            <i class="fa-solid fa-xmark"></i>
          </button>
        `;
        photoGrid.appendChild(div);
      });
    }

    // 刪除照片
    function removePhoto(idx) {
      if (!activeFeatureId || !surveyDataMap[activeFeatureId]) return;
      surveyDataMap[activeFeatureId].photos.splice(idx, 1);
      renderPhotosList();
      updateCounts();
    }

    // GPS 定位切換與追蹤
    function toggleLocate() {
      if (!navigator.geolocation) {
        alert('您的裝置或瀏覽器不支援 GPS 定位服務功能。');
        return;
      }

      const btn = document.getElementById('locate-btn');
      const statusText = document.getElementById('gps-status');

      btn.classList.add('animate-pulse', 'text-blue-600');
      statusText.innerText = 'GPS: 定位中...';

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const accuracy = pos.coords.accuracy;

          userLocation = L.latLng(lat, lng);

          if (userMarker) {
            userMarker.setLatLng(userLocation);
            accuracyCircle.setLatLng(userLocation).setRadius(accuracy);
          } else {
            userMarker = L.marker(userLocation, {
              icon: L.divIcon({
                className: 'custom-user-icon',
                html: `<div class="w-4 h-4 bg-blue-600 border-2 border-white rounded-full shadow-md animate-ping"></div><div class="w-4 h-4 bg-blue-600 border-2 border-white rounded-full shadow-md -mt-4"></div>`,
                iconSize: [16, 16],
                iconAnchor: [8, 8]
              })
            }).addTo(map);

            accuracyCircle = L.circle(userLocation, {
              radius: accuracy,
              color: '#3b82f6',
              fillColor: '#60a5fa',
              fillOpacity: 0.15,
              weight: 1
            }).addTo(map);
          }

          map.flyTo(userLocation, 17, { duration: 1 });
          btn.classList.remove('animate-pulse', 'text-blue-600');
          statusText.innerText = `GPS: 精度 ±${Math.round(accuracy)}m`;
        },
        (err) => {
          console.error(err);
          btn.classList.remove('animate-pulse', 'text-blue-600');
          statusText.innerText = 'GPS: 定位失敗';
          alert('無法獲取您的 GPS 位置，請確認手機已開啟定位權限服務。');
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    // 統計資料數量更新
    function updateCounts() {
      let totalPhotos = 0;
      let totalNotes = 0;

      Object.values(surveyDataMap).forEach(item => {
        if (item.photos && item.photos.length > 0) totalPhotos += item.photos.length;
        if (item.notes && item.notes.trim() !== '') totalNotes++;
      });

      document.getElementById('stat-photos').innerText = totalPhotos;
      document.getElementById('stat-notes').innerText = totalNotes;
    }

    // 切換側邊欄
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('translate-x-full');
    }

    // 匯出 Excel 與 照片 ZIP 包
    async function exportData() {
      const items = Object.values(surveyDataMap);
      if (items.length === 0) {
        alert('目前無可匯出的調查資料！');
        return;
      }

      // 1. 準備 Excel 資料 (XLSX)
      const excelRows = items.map((item, index) => {
        const photoNames = (item.photos || []).map(p => p.name).join('; ');
        const surveyLat = item.surveyCoords ? item.surveyCoords.lat : '';
        const surveyLng = item.surveyCoords ? item.surveyCoords.lng : '';

        return {
          '項次': index + 1,
          '物件編號/ID': item.id,
          '實測緯度 (Lat)': surveyLat,
          '實測經度 (Lng)': surveyLng,
          '現場調查備註': item.notes || '',
          '拍攝照片檔名清單': photoNames,
          ...item.properties
        };
      });

      const worksheet = XLSX.utils.json_to_sheet(excelRows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "現調紀錄");
      
      const dateStr = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(workbook, `現調紀錄表_${dateStr}.xlsx`);

      // 2. 打包照片成 ZIP 檔
      const zip = new JSZip();
      const imgFolder = zip.folder("photos");
      let photoCount = 0;

      items.forEach(item => {
        (item.photos || []).forEach(photo => {
          // 移除 dataUrl base64 前綴
          const base64Data = photo.dataUrl.split(',')[1];
          if (base64Data) {
            imgFolder.file(photo.name, base64Data, { base64: true });
            photoCount++;
          }
        });
      });

      if (photoCount > 0) {
        const content = await zip.generateAsync({ type: "blob" });
        saveAs(content, `現調照片包_${dateStr}.zip`);
      }
    }

    // 頁面載入後初始化
    window.onload = function () {
      initMap();
    };
  </script>
</body>
